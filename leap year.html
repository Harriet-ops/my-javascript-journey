<!DOCTYPE html>
<html>
  <head>
    <title>Leap Year Checker</title>
  </head>
  <body>
    <h1>Ethan's Leap Year Checker</h1>

    <p>Enter a year to find out if it's a leap year:</p>
    <input type="number" id="year" placeholder="Enter a year">
    <br><br>

    <button id="checkBtn">Check</button>

    <p id="result"></p>

    <script>
      function checkLeapYear() {
        const year = Number(document.getElementById('year').value);
        const result = document.getElementById('result');

        
        if (!year || year <= 0) {
          result.textContent = "Please enter a valid positive year.";
          return;
        }

        
        if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
          result.textContent = year + " is a Leap Year!";
        } else {
          result.textContent = year + " is NOT a Leap Year.";
        }
      }

    
      document.getElementById('checkBtn').addEventListener('click', checkLeapYear);
    </script>
  </body>
</html>
