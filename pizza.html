<!DOCTYPE html>
<html>
  <head>
    <title>Pizza Party</title>
  </head>
  <body>
    <h1>PARTY & PIZZA</h1>

    <input type="number" id="pizza" placeholder="Enter number of pizzas"><br><br>
    <input type="number" id="party" placeholder="Enter number of people"><br><br>

    <button id="Submitbtn">Submit</button>

    <p id="PizzaParty"></p>

    <script>
      function calc() {
        const pizzaNum = Number(document.getElementById('pizza').value);
        const partyPeople = Number(document.getElementById('party').value);
        const output = document.getElementById('PizzaParty');

        if (!pizzaNum || !partyPeople || pizzaNum <= 0 || partyPeople <= 0) {
          output.textContent = "Please enter valid numbers greater than 0.";
          return;
        }

        const totalSlices = pizzaNum * 8; 
        const slicesPerPerson = Math.floor(totalSlices / partyPeople);
        const leftover = totalSlices % partyPeople;

        output.textContent =
          `Each person gets ${slicesPerPerson} slice(s), and there are ${leftover} slice(s) left over.`;
      }

      
      document.getElementById('Submitbtn').addEventListener('click', calc);
    </script>
  </body>
</html>
