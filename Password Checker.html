<!DOCTYPE html>
<html>
    <head>
        <title>password</title>
    </head>
    <body>
        <h1>LOGIN</h1>
        <input type="text" id="name" placeholder="Enter username"></input><br>
        <br>
        <input type="password" id="lily" placeholder="Enter password"></input><br>
        <br>
        <button id="Submitbtn">Submit</button>

        <p id="game"></p>

     <script>
        function Checkpassword() {

            
            const code = document.getElementById('lily').value;
            let lilyPass= 'lemon123';
            const output = document.getElementById('game');

            if (code !== lilyPass ){
                
                output.textContent= 'Access Denied! '

            }else{
                output.textContent= 'Access Granted!'
            }
        }

      
      document.getElementById('Submitbtn').addEventListener('click',Checkpassword)

     </script>
    </body>
</html>
